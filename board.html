<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>게시판 — 쇼츠스탑</title>
<meta name="description" content="쇼츠스탑 이용자들이 닉네임, 제목, 내용으로 글을 남길 수 있는 게시판입니다." />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          tertiary: "#ab0b1c",
          "on-background": "#0b1c30",
          "primary-container": "#2563eb",
          "on-primary": "#ffffff",
          "on-secondary": "#ffffff",
          "tertiary-container": "#cf2c30",
          "surface-container-highest": "#d3e4fe",
          "surface-container-low": "#eff4ff",
          secondary: "#9d4300",
          "on-surface": "#0b1c30",
          "surface-container": "#e5eeff",
          primary: "#004ac6",
          "on-primary-container": "#eeefff",
          "surface-container-lowest": "#ffffff",
          "on-tertiary-container": "#ffecea",
          "outline-variant": "#c3c6d7",
          background: "#f8f9ff",
          "secondary-container": "#fd761a",
          error: "#ba1a1a",
          "surface-container-high": "#dce9ff",
          outline: "#737686",
          "primary-fixed": "#dbe1ff",
          "on-tertiary": "#ffffff",
          surface: "#f8f9ff",
          "on-surface-variant": "#434655",
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: { base: "8px", "container-padding": "20px", "stack-lg": "40px", gutter: "16px", "stack-md": "24px", "stack-sm": "12px" },
        fontFamily: {
          "display-lg": ["Hanken Grotesk"],
          "body-md": ["Hanken Grotesk"],
          "headline-lg-mobile": ["Hanken Grotesk"],
          "label-sm": ["JetBrains Mono"],
          "headline-lg": ["Hanken Grotesk"],
        },
        fontSize: {
          "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
          "headline-lg-mobile": ["22px", { lineHeight: "30px", fontWeight: "600" }],
          "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
          "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "600" }],
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 22px; }
  .glass-card { background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); border: 1px solid rgba(226,232,240,0.6); }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-16">

<!-- Top App Bar -->
<header class="w-full top-0 sticky z-40 bg-background/90 backdrop-blur-md">
  <div class="flex items-center justify-between px-container-padding py-base w-full max-w-md mx-auto">
    <div class="flex items-center gap-2">
      <a href="index.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container hover:opacity-80 transition-opacity" aria-label="홈으로 이동">
        <span class="material-symbols-outlined text-on-surface-variant text-lg">arrow_back</span>
      </a>
      <h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">게시판</h1>
    </div>
    <span class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container">
      <span class="material-symbols-outlined text-primary text-lg">forum</span>
    </span>
  </div>
</header>

<main class="max-w-md mx-auto px-container-padding mt-stack-sm space-y-stack-lg">

  <!-- Write form -->
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md">
    <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-[18px] mb-1">글 남기기</h2>
    <p class="text-body-md font-body-md text-on-surface-variant mb-stack-md leading-relaxed">
      숏폼 절제 경험이나 궁금한 점을 다른 사용자들과 나눠보세요.
    </p>

    <div class="space-y-3">
      <div>
        <label for="nicknameInput" class="text-label-sm font-label-sm text-on-surface-variant tracking-widest uppercase">닉네임</label>
        <input id="nicknameInput" type="text" maxlength="20"
          class="mt-1 w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm text-on-background placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          placeholder="예) 절제왕" />
      </div>
      <div>
        <label for="titleInput" class="text-label-sm font-label-sm text-on-surface-variant tracking-widest uppercase">제목</label>
        <input id="titleInput" type="text" maxlength="100"
          class="mt-1 w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm text-on-background placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          placeholder="예) 강한 제한 강도 3일째 후기" />
      </div>
      <div>
        <label for="contentInput" class="text-label-sm font-label-sm text-on-surface-variant tracking-widest uppercase">내용</label>
        <textarea id="contentInput" rows="4" maxlength="2000"
          class="mt-1 w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm text-on-background placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          placeholder="경험이나 하고 싶은 이야기를 자유롭게 적어주세요."></textarea>
      </div>
    </div>

    <button id="submitBtn" class="w-full mt-stack-md py-3.5 bg-primary text-on-primary font-bold rounded-full flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
      <span class="material-symbols-outlined hidden animate-spin text-lg" id="btnSpinner">progress_activity</span>
      <span class="material-symbols-outlined text-lg" id="btnIcon">edit</span>
      <span id="btnText">글 등록하기</span>
    </button>

    <div id="formError" class="hidden mt-3 bg-tertiary-container/10 border border-tertiary/30 text-tertiary text-sm rounded-lg px-3 py-2.5"></div>
  </section>

  <!-- Post list -->
  <section>
    <div class="flex items-center justify-between mb-stack-sm px-1">
      <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-[18px]">전체 글</h2>
      <span class="font-label-sm text-label-sm text-on-surface-variant" id="postCount"></span>
    </div>

    <div id="listError" class="hidden mb-stack-sm bg-tertiary-container/10 border border-tertiary/30 text-tertiary text-sm rounded-lg px-3 py-2.5"></div>

    <div id="loadingState" class="flex flex-col items-center justify-center py-stack-lg text-on-surface-variant gap-2">
      <span class="material-symbols-outlined animate-spin">progress_activity</span>
      <span class="text-sm">불러오는 중...</span>
    </div>

    <div id="emptyState" class="hidden flex-col items-center justify-center py-stack-lg text-center gap-2">
      <span class="material-symbols-outlined text-outline text-3xl">chat_bubble</span>
      <p class="text-sm text-on-surface-variant">아직 등록된 글이 없어요.<br/>첫 번째 글을 남겨보세요!</p>
    </div>

    <ul id="postList" class="space-y-3"></ul>
  </section>
</main>

<script>
  const submitBtn = document.getElementById('submitBtn');
  const btnSpinner = document.getElementById('btnSpinner');
  const btnIcon = document.getElementById('btnIcon');
  const btnText = document.getElementById('btnText');
  const formError = document.getElementById('formError');

  const postList = document.getElementById('postList');
  const postCount = document.getElementById('postCount');
  const loadingState = document.getElementById('loadingState');
  const emptyState = document.getElementById('emptyState');
  const listError = document.getElementById('listError');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      const now = new Date();
      const diffMs = now - d;
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return '방금 전';
      if (diffMin < 60) return `${diffMin}분 전`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}시간 전`;
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${mm}.${dd}`;
    } catch (e) {
      return '';
    }
  }

  function renderPosts(posts) {
    postList.innerHTML = '';
    postCount.textContent = posts.length > 0 ? `총 ${posts.length}개` : '';

    if (posts.length === 0) {
      emptyState.classList.remove('hidden');
      emptyState.classList.add('flex');
      return;
    }
    emptyState.classList.add('hidden');
    emptyState.classList.remove('flex');

    posts.forEach((post) => {
      const li = document.createElement('li');
      li.className = 'bg-surface-container-lowest border border-outline-variant rounded-xl p-gutter';
      li.innerHTML = `
        <div class="flex items-start justify-between gap-2 mb-1.5">
          <h3 class="font-bold text-on-background text-sm leading-snug break-words">${escapeHtml(post.title)}</h3>
          <span class="text-[11px] text-outline whitespace-nowrap mt-0.5">${escapeHtml(formatDate(post.createdAt))}</span>
        </div>
        <p class="text-sm text-on-surface-variant leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(post.content)}</p>
        <div class="flex items-center gap-1.5 mt-2.5 pt-2.5 border-t border-outline-variant">
          <span class="material-symbols-outlined text-primary text-sm">account_circle</span>
          <span class="text-xs font-bold text-primary">${escapeHtml(post.nickname)}</span>
        </div>
      `;
      postList.appendChild(li);
    });
  }

  async function loadPosts() {
    loadingState.classList.remove('hidden');
    listError.classList.add('hidden');
    try {
      const res = await fetch('/api/posts');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '게시글을 불러오지 못했습니다.');
      renderPosts(data.posts || []);
    } catch (err) {
      listError.textContent = err.message || '게시글을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
      listError.classList.remove('hidden');
    } finally {
      loadingState.classList.add('hidden');
    }
  }

  async function handleSubmit() {
    const nickname = document.getElementById('nicknameInput').value.trim();
    const title = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();

    formError.classList.add('hidden');

    if (!nickname || !title || !content) {
      formError.textContent = '닉네임, 제목, 내용을 모두 입력해주세요.';
      formError.classList.remove('hidden');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-60');
    btnSpinner.classList.remove('hidden');
    btnIcon.classList.add('hidden');
    btnText.textContent = '등록 중...';

    try {
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, title, content })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '글 등록 중 오류가 발생했습니다.');

      document.getElementById('nicknameInput').value = '';
      document.getElementById('titleInput').value = '';
      document.getElementById('contentInput').value = '';

      await loadPosts();
    } catch (err) {
      formError.textContent = err.message || '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      formError.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-60');
      btnSpinner.classList.add('hidden');
      btnIcon.classList.remove('hidden');
      btnText.textContent = '글 등록하기';
    }
  }

  submitBtn.addEventListener('click', handleSubmit);
  loadPosts();
</script>
</body>
</html>
